name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Valores fictícios: o build só precisa que existam.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.5.6
      # O runtime das Edge Functions só remove tipos; a checagem acontece aqui.
      - run: deno check --config supabase/functions/deno.json supabase/functions/recommend/index.ts supabase/functions/scheduled-run/index.ts supabase/functions/assistant/index.ts

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Sobe só o Postgres, aplica as migrations e roda os testes pgTAP (RLS, agendamento, idempotência).
      - run: supabase db start
      - run: supabase test db
